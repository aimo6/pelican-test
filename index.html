<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="鹈鹕测试 —— 用于测试大语言模型生成 SVG 图形能力的本地工具，支持多协议模型接入（Chat Completions / Responses / Messages）、供应商配置、模型拉取、提示词测试与历史记录。"
    />
    <title>鹈鹕测试 · SVG 模型测试</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235A8A6A'/%3E%3Ccircle cx='16' cy='14' r='6' fill='none' stroke='%23FFFDF8' stroke-width='2.5'/%3E%3Cpath d='M16 20v6' stroke='%23FFFDF8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__logo" aria-hidden="true">
            <!-- 图标路径来自 Lucide（ISC 许可）的 bird 图标 -->
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M16 7h.01" />
              <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20" />
              <path d="m20 7 2 .5-2 .5" />
              <path d="M10 18v3" />
              <path d="M14 17.75V21" />
              <path d="M7 18a6 6 0 0 0 3.84-10.61" />
            </svg>
          </span>
          <span class="topbar__name" id="brand-name">鹈鹕测试</span>
          <span class="topbar__tag" id="brand-tag">SVG 模型测试</span>
        </div>
        <div class="topbar__actions" id="topbar-actions"></div>
      </header>

      <div class="banner-root" id="banner-root"></div>

      <div class="layout">
        <!-- 挂载点：实际样式由 JS 组件渲染出的 .sidebar / .panel 提供 -->
        <div class="layout__slot" id="sidebar"></div>
        <main class="workspace" id="workspace"></main>
      </div>
    </div>

    <div class="toast-root" id="toast-root" aria-live="polite"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
